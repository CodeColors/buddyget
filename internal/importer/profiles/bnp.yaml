# BNP Paribas : export CSV ou Excel des opérations d'un compte.
#
# PROVISOIRE : établi sans export réel (aucun fichier fourni à ce jour).
# Pour l'ajuster, copiez ce fichier dans /data/profiles/bnp.yaml et modifiez
# les intitulés : chaque donnée accepte plusieurs intitulés possibles, la
# casse et les accents sont ignorés.
nom: BNP Paribas
colonnes:
  date: ["Date opération", "Date d'opération"]
  libelle: ["Libellé opération", "Libellé court", "Libellé"]
  montant: ["Montant opération", "Montant opération en euro", "Montant (EUR)"]
format_date: JJ/MM/AAAA
