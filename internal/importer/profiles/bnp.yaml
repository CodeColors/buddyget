# BNP Paribas : export Excel des opérations d'un compte.
#
# Vérifié sur un export réel (.xls) : ligne de synthèse (compte, solde),
# ligne vide, puis l'en-tête en ligne 3 ; colonnes « Date operation »,
# « Categorie operation », « Sous Categorie operation », « Libelle
# operation », « Montant operation », « Pointage operation », « Commentaire
# operation ». Les dates sont écrites en texte, au format JJ-MM-AAAA.
#
# Pour l'ajuster, copiez ce fichier dans /data/profiles/bnp.yaml et modifiez
# les intitulés : chaque donnée accepte plusieurs intitulés possibles, la
# casse et les accents sont ignorés.
nom: BNP Paribas
colonnes:
  date: ["Date operation", "Date d'opération"]
  libelle: ["Libelle operation", "Libellé court", "Libellé"]
  montant: ["Montant operation", "Montant opération en euro", "Montant (EUR)"]
format_date: JJ-MM-AAAA
