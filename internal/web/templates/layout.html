{{define "layout" -}}
<!doctype html>
<html lang="fr" data-theme="{{.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BuddyGet</title>
{{- if eq .Theme "auto"}}
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
{{- else if eq .Theme "dark"}}
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101217">
{{- else}}
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f6f8">
{{- end}}
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="manifest" href="{{asset "manifest.webmanifest"}}">
</head>
<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="topbar">
  <a class="brand" href="/">
    <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 22V10h7a3.5 3.5 0 0 1 0 7H9m7 0h1a3 3 0 0 1 0 5H9"/></svg>
    <span>BuddyGet</span>
  </a>
  {{- with .User}}
  <div class="topbar-actions">
    <form class="theme-switch" method="post" action="/preferences/theme">
      <fieldset>
        <legend class="sr-only">Thème d'affichage</legend>
        <input type="hidden" name="back" value="{{$.Path}}">
        <button class="icon-btn" name="theme" value="auto" aria-pressed="{{eq $.Theme "auto"}}" title="Thème automatique (selon l'appareil)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
          <span class="sr-only">Thème automatique</span>
        </button>
        <button class="icon-btn" name="theme" value="light" aria-pressed="{{eq $.Theme "light"}}" title="Thème clair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr-only">Thème clair</span>
        </button>
        <button class="icon-btn" name="theme" value="dark" aria-pressed="{{eq $.Theme "dark"}}" title="Thème sombre">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <span class="sr-only">Thème sombre</span>
        </button>
      </fieldset>
    </form>
    <form method="post" action="/logout">
      <button class="icon-btn" title="Se déconnecter ({{.Username}})">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3m7-4 4-4-4-4m4 4H10"/></svg>
        <span class="sr-only">Se déconnecter</span>
      </button>
    </form>
  </div>
  {{- end}}
</header>
{{- if .User}}
<nav class="tabbar" aria-label="Navigation principale">
  <a href="/"{{if eq .Path "/"}} aria-current="page"{{end}}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <span>Accueil</span>
  </a>
</nav>
{{- end}}
<main id="contenu" class="{{if .User}}page{{else}}page page-centered{{end}}">
{{template "content" .}}
</main>
</body>
</html>
{{- end}}
